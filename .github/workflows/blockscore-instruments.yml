name: BlockScore Instruments

on:
  push:
    paths:
      - 'fabric/blockscore-instruments/**'
      - '.github/workflows/blockscore-instruments.yml'
  pull_request:
    paths:
      - 'fabric/blockscore-instruments/**'
      - '.github/workflows/blockscore-instruments.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build BlockScore Instruments
        working-directory: fabric/blockscore-instruments
        run: gradle build --stacktrace

      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: blockscore-instruments-jar
          path: fabric/blockscore-instruments/build/libs/*.jar

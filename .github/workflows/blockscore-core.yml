name: BlockScore Core

on:
  push:
    paths:
      - 'src/**'
      - 'pytests/**'
      - 'data/**'
      - 'specs/**'
      - 'fixtures/**'
      - 'tests/**'
      - 'prototypes/**'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - '.github/workflows/blockscore-core.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pytests/**'
      - 'data/**'
      - 'specs/**'
      - 'fixtures/**'
      - 'tests/**'
      - 'prototypes/**'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - '.github/workflows/blockscore-core.yml'
  workflow_dispatch:

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install BlockScore core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run executable contracts and compiler tests
        run: python -m unittest discover -s pytests -v
      - name: Validate repository
        run: python -m blockscore validate-repo .
      - name: Recompile Mars from Minecraft Master
        run: |
          python -m blockscore compile-command-rail fixtures/mars/master-events-m001-m008.yaml --repo-root . --qpm 132 --tps 20 --pulse-ticks 1 --busy-window-ticks 2 --namespace blockscore_ci_mars --title "Mars CI" --output "$RUNNER_TEMP/blockscore-mars"
      - name: Validate generated Mars datapack
        run: python -m blockscore validate-pack "$RUNNER_TEMP/blockscore-mars"
